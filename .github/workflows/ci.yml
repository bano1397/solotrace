name: Tests, compliance gate and dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements.txt
      - name: Test suite (LedgerLite + SoloTrace)
        run: python -m pytest -q
      - name: Every audit citation still points at real code
        run: python -m solotrace verify --out out --check
      - name: Every requirement's tests still catch every sabotage
        run: python -m solotrace prove --out out --workers 4

  pages:
    # The public dashboard is only published when the tests and the compliance gate pass.
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/
      - id: deployment
        uses: actions/deploy-pages@v4
